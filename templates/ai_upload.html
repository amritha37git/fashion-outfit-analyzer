<!DOCTYPE html>
<html>
<head>
    <title>AI Clothing Upload</title>

    <style>

        body{
            font-family:Arial;
            width:500px;
            margin:auto;
            margin-top:60px;
        }

        h2{
            text-align:center;
        }

        form{
            border:1px solid #ddd;
            padding:30px;
            border-radius:10px;
        }

        button{
            margin-top:20px;
            width:100%;
            padding:12px;
            font-size:16px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<h2>📸 AI Clothing Analyzer</h2>

<form method="POST" enctype="multipart/form-data">

    {% csrf_token %}

    <label><b>Select Clothing Image</b></label>

    <br><br>

    <input type="file" name="image" required>

    <button type="submit">
        Analyze with AI
    </button>

</form>

</body>
</html>
