<h2>Your Wardrobe 👗</h2>

<a href="/wardrobe/upload/">+ Upload New Item</a>

<hr>

<div style="display: flex; flex-wrap: wrap; gap: 20px;">

{% for item in items %}

    <div style="width: 200px; border: 1px solid #ccc; padding: 10px; border-radius: 10px;">

        {% if item.image %}
            <img src="{{ item.image.url }}" style="width: 100%; height: 180px; object-fit: cover;">
        {% endif %}

        <h4>{{ item.name }}</h4>
        <p>{{ item.category }}</p>

    </div>

{% endfor %}

</div>
