<div class="card shadow-sm border-0 mb-5">

    <div class="card-body p-4">

        <form method="POST">

            {% csrf_token %}

            <div class="row g-4">

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Occasion
                    </label>

                    <select name="occasion" class="form-select">

                        <option value="College" {% if selected_occasion == "College" %}selected{% endif %}>College</option>

                        <option value="Office" {% if selected_occasion == "Office" %}selected{% endif %}>Office</option>

                        <option value="Party" {% if selected_occasion == "Party" %}selected{% endif %}>Party</option>

                        <option value="Wedding" {% if selected_occasion == "Wedding" %}selected{% endif %}>Wedding</option>

                        <option value="Casual" {% if selected_occasion == "Casual" %}selected{% endif %}>Casual</option>

                    </select>

                </div>

                <div class="col-md-6">

                    <label class="form-label fw-semibold">
                        Weather
                    </label>

                    <select name="weather" class="form-select">

                        <option value="Sunny" {% if selected_weather == "Sunny" %}selected{% endif %}>Sunny</option>

                        <option value="Cloudy" {% if selected_weather == "Cloudy" %}selected{% endif %}>Cloudy</option>

                        <option value="Rainy" {% if selected_weather == "Rainy" %}selected{% endif %}>Rainy</option>

                        <option value="Cold" {% if selected_weather == "Cold" %}selected{% endif %}>Cold</option>

                    </select>

                </div>

            </div>

            <div class="text-center mt-4">

                <button class="btn btn-dark btn-lg px-5">

                    Generate Outfit

                </button>

            </div>

        </form>

    </div>

</div>

{% if selected_occasion and selected_weather %}

<div class="alert alert-light border text-center mb-5">

    <strong>Selected</strong>

    {{ selected_occasion }}

    •

    {{ selected_weather }}

</div>

{% endif %}

{% if error_title %}

<div class="alert alert-danger">

    <h5>{{ error_title }}</h5>

    <p class="mb-0">{{ error_message }}</p>

</div>

{% endif %}
