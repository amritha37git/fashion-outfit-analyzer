{% extends 'base.html' %}

{% block content %}

<div class="text-center mt-5">
    <h1 class="display-4">👗 Fashion Outfit Analyzer</h1>

    <p class="lead">
        Upload your clothes, organize your digital wardrobe, analyze outfits, and get AI-powered fashion recommendations.
    </p>

    {% if user.is_authenticated %}
        <a href="/dashboard/" class="btn btn-primary btn-lg">
            Go to Dashboard
        </a>
    {% else %}
        <a href="/accounts/login/" class="btn btn-primary btn-lg me-2">
            Login
        </a>

        <a href="/accounts/signup/" class="btn btn-success btn-lg">
            Register
        </a>
    {% endif %}
</div>

{% endblock %}
