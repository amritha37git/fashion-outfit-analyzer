{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>FashionAI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f6fa;
        }

        .navbar{
            background:#111827;
        }

        .navbar-brand{
            color:white;
            font-weight:bold;
            font-size:24px;
        }

        .navbar a{
            color:white !important;
        }

        .card{
            border:none;
            border-radius:15px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        footer{
            background:#111827;
            color:white;
            padding:15px;
            margin-top:50px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="{% url 'home' %}">
👗 FashionAI
</a>

<div class="ms-auto">

{% if user.is_authenticated %}

<a href="{% url 'dashboard' %}" class="me-3 text-decoration-none">
Dashboard
</a>

<a href="{% url 'wardrobe' %}" class="me-3 text-decoration-none">
Wardrobe
</a>

<a href="{% url 'upload' %}" class="me-3 text-decoration-none">
AI Upload
</a>

<a href="{% url 'logout' %}" class="text-decoration-none">
Logout
</a>

{% else %}

<a href="{% url 'login' %}" class="me-3 text-decoration-none">
Login
</a>

<a href="{% url 'signup' %}" class="text-decoration-none">
    Sign Up
</a>

{% endif %}

</div>

</div>

</nav>

<div class="container mt-5">

{% block content %}

{% endblock %}

</div>

<footer class="text-center">

FashionAI © 2026

</footer>

</body>

</html>
