<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion Outfit Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">👗 Fashion Outfit Analyzer</a>

        <div class="ms-auto">
            {% if user.is_authenticated %}
                <a href="/dashboard/" class="btn btn-outline-light btn-sm me-2">Dashboard</a>
                <a href="/wardrobe/" class="btn btn-outline-light btn-sm me-2">Wardrobe</a>
                <a href="/accounts/logout/" class="btn btn-danger btn-sm">Logout</a>
            {% else %}
                <a href="/accounts/login/" class="btn btn-outline-light btn-sm me-2">Login</a>
                <a href="/accounts/signup/" class="btn btn-success btn-sm">Sign Up</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 Fashion Outfit Analyzer | MCA Mini Project
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
