{% load static %}

<nav class="navbar">
    <div class="container navbar-container">
        
        <!-- 1. BRAND ZONE (Left) -->
        <a href="/" class="brand">
            <div class="brand-details">
                <span class="brand-name">ALAMARA<span>i</span></span>
                <span class="brand-tagline">Intelligent Digital Wardrobe</span>
            </div>
        </a>

        {% if user.is_authenticated %}
            <!-- 2. PRIMARY NAVIGATION (Center) -->
            <div class="nav-main-links">
                <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                    Dashboard
                </a>
                <a href="{% url 'wardrobe' %}" class="nav-link {% if request.resolver_match.url_name == 'wardrobe' %}active{% endif %}">
                    Wardrobe
                </a>
                <a href="{% url 'ai_upload' %}" class="nav-link {% if request.resolver_match.url_name == 'ai_upload' %}active{% endif %}">
                    Add Outfit
                </a>
                <a href="{% url 'stylist' %}" class="nav-link {% if request.resolver_match.url_name == 'stylist' %}active{% endif %}">
                    Smart Styling
                </a>
            </div>

            <!-- 3. UTILITY ZONE (Right) -->
            <div class="nav-user-actions">
                <a href="{% url 'profile' %}" class="nav-profile-link" title="Profile Settings">
                    <div class="nav-avatar-fallback">
                        {{ user.username|make_list|first|upper }}
                    </div>
                </a>
                <a href="{% url 'logout' %}" class="nav-button">
                    Logout
                </a>
            </div>
        {% else %}
            <!-- Unauthenticated State -->
            {% comment %} <div class="nav-main-links">
                <a href="#about" class="nav-link">About</a>
                <a href="#features" class="nav-link">Features</a>
            </div> {% endcomment %}
            <div class="nav-user-actions">
                <a href="{% url 'login' %}" class="nav-link">Sign In</a>
                <a href="{% url 'signup' %}" class="nav-button">Get Started</a>
            </div>
        {% endif %}

    </div>
</nav>
