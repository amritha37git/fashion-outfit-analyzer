{% extends 'base.html' %}


{% block content %}


<div class="container py-5">


    <div class="card shadow-lg border-0">


        <div class="card-body p-5">



            <h1 class="text-center fw-bold mb-5">

                🤖 AI Analysis Result

            </h1>




            <div class="row">



                <!-- IMAGE -->

                <div class="col-md-5 text-center">


                    <img src="{{ image_url }}"

                         class="img-fluid rounded shadow"

                         style="max-height:450px;">


                </div>





                <!-- DETAILS -->


                <div class="col-md-7">


                    <div class="card shadow-sm">


                        <div class="card-body">



                            <h3 class="text-primary">

                                {{ name }}

                            </h3>



                            <hr>




                            <p>

                                <strong>
                                    📂 Category
                                </strong>

                                <br>

                                {{ category }}

                            </p>





                            <p>

                                <strong>
                                    🏷 Brand
                                </strong>

                                <br>

                                {{ brand }}

                            </p>





                            <p>

                                <strong>
                                    🎨 Color
                                </strong>

                                <br>

                                {{ color }}

                            </p>





                            <p>

                                <strong>
                                    🌦 Season
                                </strong>

                                <br>


                                <span class="badge bg-success">

                                    {{ season }}

                                </span>


                            </p>





                            <p>

                                <strong>
                                    🎉 Occasion
                                </strong>

                                <br>


                                <span class="badge bg-warning text-dark">

                                    {{ occasion }}

                                </span>


                            </p>





                            <p>

                                <strong>
                                    📝 Description
                                </strong>

                                <br>


                                {{ description }}


                            </p>




                        </div>


                    </div>


                </div>



            </div>







            <!-- SAVE -->


            <form method="POST"
                  action="{% url 'save_ai_item' %}"
                  class="mt-5">


                {% csrf_token %}



                <input type="hidden"
                       name="name"
                       value="{{ name }}">



                <input type="hidden"
                       name="category"
                       value="{{ category }}">



                <input type="hidden"
                       name="brand"
                       value="{{ brand }}">



                <input type="hidden"
                       name="color"
                       value="{{ color }}">



                <input type="hidden"
                       name="season"
                       value="{{ season }}">



                <input type="hidden"
                       name="occasion"
                       value="{{ occasion }}">



                <input type="hidden"
                       name="description"
                       value="{{ description }}">



                <input type="hidden"
                       name="image"
                       value="{{ image }}">





                <button class="btn btn-success btn-lg w-100">


                    💾 Save to Wardrobe


                </button>



            </form>



        </div>


    </div>


</div>



{% endblock %}
